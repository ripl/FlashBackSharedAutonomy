root_dir: ${hydra.runtime.cwd}


wandb_project_name: 'FlashBack_videos'
wandb_log_dir: '${root_dir}/model_param/log/eval/'
wandb_entity: null
track: false
save_video: false         

beta: 0.5                     # for blend actor, the linear interpolation coefficient   


exp_name: "CM_noised_Charger"
env_id: 'SimpleChargerPlug-v1'
obs_mode: "state_dict" # there is also "state_dict", "rgbd", ...
control_mode: "pd_joint_delta_pos"  # there is also "pd_joint_delta_pos", ...
render_mode: "rgb_array"
n_env: 1

seed: 42
num_episode: 30
max_episode_step: 300
device: 'cuda'

## Diffusion Model
model_dir: "${root_dir}/model_param/weight/<YOUR_JOINT_CM_RUN_DIR>"
result_save_dir: "${root_dir}/data/eval/charger_blend_metrics.csv"
eval_user: False


joint_cm_model:
  _target_: diffusha.model.diffusion_model.JointConditionModel
  input_dim: 8                   
  condition1_dim: 32
  condition2_dim: 32                    
  hidden_dim: 256            # latent dimension for noise and class labels embedding
  share_condition_encoder: false

joint_cm_denoiser:
  _target_: diffusha.algo.denoiser.JointConditionDenoiser
  sigma_data: 0.5
  sigma_max: 80.0
  sigma_min: 0.002
  rho: 7.0
  weight_schedule: "karras"
  distillation: False
  num_timesteps: 80 

## FWD model
fwd_trainer_cfg_path: 'configs/maniskill/forward_model_charger.yaml'

n_steps: 80  #### <----------------- Change this for policy steps
noise_level:  60  #### <----------------- Change this for noise level 
condition_policy:
  steps:  ${n_steps}       
  noise_level: ${noise_level}   
  device: ${device}
  sigma_min: 0.002
  sigma_max: 80
  rho: 7.0
  sampler_method: "onestep"
  use_normalize_delta_obs: true
  # use_predict_next_state: true
  use_predict_next_state: false

expert_model: "${root_dir}/model_param/weight/charger_expert/<YOUR_EXPERT>.pth"

# actor_type: 'noisy'
# actor_kwargs:
#   eps: 0.15
#   preserve_norm: false
#   seed: ${seed} 

# actor_type: 'laggy'
# actor_kwargs:
#   repeat_prob: 0.60
#   seed: ${seed}  

actor_type: 'noised'
actor_kwargs:
  eps: 1.0
  noise_scale: 0.10
  preserve_norm: false
  seed: ${seed} 

