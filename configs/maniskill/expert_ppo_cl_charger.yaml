### Root Dir 
root_dir: ${hydra.runtime.cwd}

seed: 4322
torch_deterministic: true
cuda: true
track: true
wandb_project_name: 'test_expert_retrain'
wandb_entity: null

## Task Specification
exp_name: 'continue_PPO_Curriculum_Charger_start0.05_end0.7'
env_id: 'CurriculumChargerPlug-v1'
obs_mode: "state_dict" # there is also "state_dict", "rgbd", ...
control_mode: "pd_joint_delta_pos"  # there is also "pd_joint_delta_pos", ...
# control_mode: "pd_ee_delta_pose"  # there is also "pd_joint_delta_pos", ...
# render_mode: "human"
render_mode: "rgb_array"

n_env: 1024
num_steps_per_env: 300
total_iterations: 1200
# total_iterations: 4 # debug
curriculum_start: 0.1 # from 40% of the iterations start to tighten the progress
curriculum_end: 0.5 # from 70% of the iterations reach target process
initial_eval_threshold : 3e-2

num_mini_batch: 32 
num_training_epochs: 8
save_every_iterations: 200
## PPO 
action_rescale: 0.3
clip_coef: 0.2 
vf_coef: 0.5
ent_coef: 0.0
ent_coef_decay: False
# gamma: 0.8
gamma: 0.95
lam: 0.9
max_grad_norm: 0.5
policy_lr: 3e-4  # 3e-4
critic_lr: 1e-3
clip_vloss: true
target_kl: 0.1 


# save model
load_dir: null  # optional: path to a .pth checkpoint to resume
save_dir: '${root_dir}/model_param/weight/charger_expert'
log_dir: '${root_dir}/model_param/log/charger_expert'

# Forward Model
# use_forward_model: False
# fwd_trainer_cfg_path: 'configs/maniskill/forward_model_peg.yaml'

# Save Data for reply
num_save_data: -1
num_save_data_every: 1000

