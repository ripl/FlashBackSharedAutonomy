root_dir: ${hydra.runtime.cwd}
param_dir: 'model_param'

exp_name: 'EDM_Charger_500k' ###  <----------- Change this
seed: 42
n_iter: 2500
batch_size: 4096
gamma: 0.5  ###  <----------- Change this, 1.0 = all uncondition, no next state 
device: 'cuda:0'
lr: 0.0003
ema_rate: 0.999
use_weighting_model: true
use_normalize_delta_obs: true

# Logging with wandb
track: true
# wandb_project_name: 'edm_trainer'
wandb_project_name: 'test_train_diffusion'
wandb_entity: null
wandb_logdir: '${root_dir}/model_param/log/charger_edm/'

# save model
save_every: 500
save_dir: '${root_dir}/${param_dir}/weight/charger_edm'
log_dir: '${root_dir}/${param_dir}/log/charger_edm'

dataset:
  _target_: diffusha.data_collection.buffer.ExpertTransitionDataset_v2
  directory: "${root_dir}/dataset/<TASK>/<YOUR_COLLECTION_RUN>"
  state_dim: 32
  action_dim: 8
  use_transition: true
  add_noise: false

joint_edm_model:
  _target_: diffusha.model.diffusion_model.JointConditionModel
  input_dim: 8                       
  condition1_dim: 32
  condition2_dim: 32                 
  hidden_dim: 256            # latent dimension for noise and class labels embedding
  share_condition_encoder: false

joint_edm_denoiser:
  _target_: diffusha.algo.denoiser.JointConditionDenoiser
  sigma_data: 0.5
  sigma_max: 80.0
  sigma_min: 0.002
  rho: 7.0
  weight_schedule: "karras"
  distillation: False
  num_timesteps: 80 

# Forward Model
use_forward_model: true
fwd_trainer_cfg_path: 'configs/maniskill/forward_model_charger.yaml'
load_fwd_path: null
