#   preserve_norm: false
#   seed: ${seed} 

# actor_type: 'laggy'
# actor_kwargs:
#   repeat_prob: 0.80
#   seed: ${seed} 

actor_type: 'noised'
actor_kwargs:
  eps: 1.0
  noise_scale: 0.2
  preserve_norm: false
  seed: ${seed} 


