# exp_name: 'jointCM_reacher' ### <----------------- Change this to your experiment name
# seed: 42
# n_iter: 5000
# batch_size: 8192
# device: 'cuda:1'
root_dir: ${hydra.runtime.cwd}


exp_name: 'CM_noised' ### <----------------- Change this to your experiment name
seed: 42
n_iter: 5000
batch_size: 2048
device: 'cuda:2'
lr: 0.0003
ema_rate: 0.999
target_rate: 0.999
discrete_steps: 80
gamma: 0.5
use_weighting_model: false
use_normalize_delta_obs: true


# Logging with wandb
track: true
# wandb_project_name: 'cm_trainer'
wandb_project_name: 'diffusha'
wandb_entity: null
wandb_logdir: '${root_dir}/model_param/log/joint_combined/'

# save model
save_every: 2000
save_dir: '${root_dir}/data/joint_combined'
log_dir: '${root_dir}/log/joint_combined'

dataset:
  _target_: diffusha.data_collection.buffer.ExpertTransitionDataset_v2
  # directory: "${root_dir}/data/DC_debug/DC_r03_noisy_p01_plus_20250107-1856" ###  <----------- Change this
  directory: "${root_dir}/data/<YOUR_COLLECTED_TRANSITION_DATASET>"
  # directory: "${root_dir}/data/DC_debug/DC_r03_clean_plus_20250107-1854"
  state_dim: 35
  action_dim: 8
  use_transition: true
  add_noise : false

joint_cm_model:
  _target_: diffusha.model.diffusion_model.JointConditionModel
  input_dim: 8                
  condition1_dim: 35
  condition2_dim: 35                
  hidden_dim: 256             
  share_condition_encoder: false

joint_cm_denoiser:
  _target_: diffusha.algo.denoiser.JointConditionDenoiser
  sigma_data: 0.5
  sigma_max: 80.0
  sigma_min: 0.002
  rho: 7.0
  weight_schedule: "karras"
  distillation: true
  num_timesteps: 80 

teacher_model_path: "${root_dir}/data/<YOUR_TRAINED_JOINT_EDM>.pth"

joint_edm_model:
  _target_: diffusha.model.diffusion_model.JointConditionModel
  input_dim: 8                
  condition1_dim: 35
  condition2_dim: 35                  
  hidden_dim: 256             # latent dimension for noise and class labels embedding
  share_condition_encoder: false

joint_edm_denoiser:
  _target_: diffusha.algo.denoiser.JointConditionDenoiser
  sigma_data: 0.5
  sigma_max: 80.0
  sigma_min: 0.002
  rho: 7.0
  weight_schedule: "karras"
  distillation: False
  num_timesteps: 80 

use_forward_model: true
fwd_trainer_cfg_path: 'configs/maniskill/forward_model_peg.yaml'
